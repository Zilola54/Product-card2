<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>Product card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body style="font-family: Montserrat;">
  <div class="all-elements">
    <div class="background-picture">
      <h1 class="product-selection_title">Выбери свой продукт</h1>
      <div class="buttons">
        <button id="recolor-first-card-button">Перекрась фон первой карточки</button>
        <button id="recolor-all-card-button">Перекрась фон всех карточки</button>
        <button id="recolor-last-card-button">Перекрась фон последней карточки</button>
        <button id="open-google-button">Открыть Google</button>
      </div>
      <div class="registration">
          <button type="submit" class="open-btn">Войти</button>
      </div>
      <div class="products-list"></div>
    </div>
  </div>
  <template id="product-template">
    <div class="product-card">
      <img class="product-image">
      <p class="product-skin-type"></p>
      <h3 class="product-title"></h3>
      <p class="product-description"></p>
      <span class="product-card_text">Состав:</span>
      <ul class="product-compound"></ul>
      <div class="product-price">
        <span class="price-label">Цена:</span>
        <span class="price"></span>
      </div>
    </div>
  </template>

  <footer class="footer">

    <div class="footer__container">

      <div class="footer__brand">
        <div class="footer__title">Product Cards</div>
        <p class="footer__description">У Нас Самые Лучшие Продукты Для Кожи</p>
        <div class="footer__socials">
          <a href="https://t.me"> <img src="./image/telegram-icon.svg" alt="telegram"></a>
          <a href="https://vk.com"> <img src="./image/vk-icon.svg" alt="vk"></a>
        </div>
      </div>
      
      <div class="footer__subscribe">
        <div class="footer__subscribe-label">Подпишись на наши акции:</div>
        <form class="subscribe-form" id="subscribe-form" action="" method="get">
          <input type="email" name="email" class="subscribe-form__input" placeholder="Введи email" required>
          <button type="submit" class="subscribe-form__button">Подписаться</button>
        </form>
      </div>

      <nav class="footer__nav">
        <h4>Быстрые ссылки</h4>
        <ul>
          <li>
            <a href="#">Главная</a>
          </li>
          <li>
            <a href="#">Магазин</a>
          </li>
          <li>
            <a href="#">Контакты</a>
          </li>
        </ul>
      </nav> 
    </div>

    <div class="footer__bottom">
      <hr class="footer__divider">
      <p class="footer__copyright">www.product-cards.com©all right reserve</p>
    </div>

  </footer>

  <div class="overlay" id="modalOverlay">
    <form id="reg-form">
      <span class="close-cross">&times;</span> 
      <h1>Регистрация</h1>

      <div class="form-group">
        <label for="firstname">Имя</label>
        <input id="firstname" placeholder="Введите своё имя" name="firstname" type="text"required>
      </div>
      <div class="form-group">
        <label for="lastname">Фамилия</label>
        <input id="lastname" placeholder="Введите свою фамилию" name="lastname" type="text"required>
      </div>
      <div class="form-group">
        <label for="dob">Дата рождения</label>
        <input id="dob" placeholder="Введите свою дату рождения" name="dateOfBirth" type="date"required>
      </div>
      <div class="form-group">
        <label for="userName">Логин</label>
        <input id="userName" placeholder="Логин" name="userName" type="text"required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input id="password" placeholder="Пароль" name="password" type="password" minlength="6" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Повторите пароль</label>
        <input id="confirmPassword" placeholder="Повторите пароль" name="confirmPassword" type="password"required>
      </div>
      <button type="submit">Зарегистрироваться</button>
      <button type="button" id="cancel-btn">Закрыть</button>
    </form>
  </div>
  <script type="module" src="main.js"></script>
</body>

</html>
